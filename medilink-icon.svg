<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="120" y1="80" x2="910" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12304f"/>
      <stop offset="0.58" stop-color="#0b5f69"/>
      <stop offset="1" stop-color="#0d7377"/>
    </linearGradient>
    <linearGradient id="cover" x1="300" y1="180" x2="760" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eaf2f6"/>
    </linearGradient>
    <linearGradient id="phone" x1="340" y1="335" x2="705" y2="705" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18a3a0"/>
      <stop offset="1" stop-color="#0d7377"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#071d2e" flood-opacity="0.30"/>
    </filter>
    <filter id="phoneShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="15" stdDeviation="13" flood-color="#062238" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Full-bleed background also works safely when Android applies a circular or squircle mask. -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="870" cy="145" r="245" fill="#ffffff" opacity="0.055"/>
  <circle cx="135" cy="895" r="300" fill="#5fd0c9" opacity="0.075"/>

  <!-- Directory / address book. -->
  <g filter="url(#shadow)">
    <rect x="244" y="190" width="548" height="674" rx="86" fill="#08283f" opacity="0.40"/>
    <rect x="270" y="166" width="528" height="680" rx="82" fill="url(#cover)"/>
    <path d="M350 166H352V846H350C306 846 270 810 270 766V246C270 202 306 166 350 166Z" fill="#dce8ee"/>
    <rect x="326" y="166" width="38" height="680" fill="#0d7377" opacity="0.94"/>

    <!-- Binding rings. -->
    <g fill="#f7fbfd" stroke="#12304f" stroke-width="12">
      <rect x="230" y="270" width="138" height="42" rx="21"/>
      <rect x="230" y="388" width="138" height="42" rx="21"/>
      <rect x="230" y="506" width="138" height="42" rx="21"/>
      <rect x="230" y="624" width="138" height="42" rx="21"/>
      <rect x="230" y="742" width="138" height="42" rx="21"/>
    </g>

    <!-- Directory index tabs. -->
    <path d="M782 278H832C849 278 862 291 862 308V365H782Z" fill="#f2b84b"/>
    <path d="M782 405H844C861 405 874 418 874 435V492H782Z" fill="#69c8c3"/>
    <path d="M782 532H832C849 532 862 545 862 562V619H782Z" fill="#f2b84b"/>

    <!-- Simple directory entries remain legible at launcher-icon size. -->
    <g opacity="0.9">
      <circle cx="438" cy="287" r="28" fill="#c9d9e3"/>
      <rect x="490" y="266" width="210" height="18" rx="9" fill="#12304f"/>
      <rect x="490" y="300" width="145" height="14" rx="7" fill="#7891a4"/>
      <circle cx="438" cy="397" r="28" fill="#c9d9e3"/>
      <rect x="490" y="376" width="180" height="18" rx="9" fill="#12304f"/>
      <rect x="490" y="410" width="225" height="14" rx="7" fill="#7891a4"/>
      <circle cx="438" cy="507" r="28" fill="#c9d9e3"/>
      <rect x="490" y="486" width="220" height="18" rx="9" fill="#12304f"/>
      <rect x="490" y="520" width="125" height="14" rx="7" fill="#7891a4"/>
      <circle cx="438" cy="617" r="28" fill="#c9d9e3"/>
      <rect x="490" y="596" width="165" height="18" rx="9" fill="#12304f"/>
      <rect x="490" y="630" width="205" height="14" rx="7" fill="#7891a4"/>
      <circle cx="438" cy="727" r="28" fill="#c9d9e3"/>
      <rect x="490" y="706" width="195" height="18" rx="9" fill="#12304f"/>
      <rect x="490" y="740" width="150" height="14" rx="7" fill="#7891a4"/>
    </g>
  </g>

  <!-- Telephone receiver laid over the directory. -->
  <g filter="url(#phoneShadow)" transform="rotate(-12 525 520)">
    <path d="M358 358C388 493 508 620 654 674" fill="none" stroke="#ffffff" stroke-width="126" stroke-linecap="round" opacity="0.96"/>
    <path d="M358 358C388 493 508 620 654 674" fill="none" stroke="url(#phone)" stroke-width="92" stroke-linecap="round"/>
    <rect x="282" y="286" width="185" height="112" rx="45" fill="#ffffff"/>
    <rect x="298" y="302" width="153" height="80" rx="32" fill="url(#phone)"/>
    <rect x="586" y="631" width="190" height="112" rx="45" fill="#ffffff"/>
    <rect x="602" y="647" width="158" height="80" rx="32" fill="url(#phone)"/>
  </g>
</svg>
